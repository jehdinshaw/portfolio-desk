  const st = streaks();
  el.innerHTML = `<div class="two-col"><div>
    <div class="seg" id="jKind" style="margin-bottom:6px"><button data-v="journal" class="${isJ ? "on" : ""}">Daily journal</button><button data-v="research" class="${!isJ ? "on" : ""}">Research note</button></div>
    <h2>${isJ ? (ed.date === todayET() ? "Today" : fmtDate(ed.date, { weekday:"long", month:"short", day:"numeric" })) : (ed.path ? "Edit note" : "New research note")}
      <span class="faint small">${isJ ? fmtDate(ed.date, { month:"long", day:"numeric", year:"numeric" }) : ""}</span></h2>
    ${!isJ ? `<input class="in" id="jTitle" placeholder="Title, e.g. Why I'm long Costco" value="${esc(ed.title || "")}" ${ed.path ? "disabled" : ""}>` : ""}
    <textarea class="in" id="jBody" rows="16" style="margin-top:8px;font-size:15px" placeholder="Loading…" disabled></textarea>
    <div class="wc" id="jWc"></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn primary" id="jSave" style="flex:1" disabled>${exists ? "Save changes" : "Save to GitHub"}</button>
      ${!isJ || ed.date !== todayET() ? `<button class="btn" id="jNew">${isJ ? "Back to today" : "New note"}</button>` : ""}
    </div>
    <p class="tiny faint" id="jStatus">${exists ? "Edits get a new GitHub timestamp. The original version stays in the record." : "Drafts are kept on this device until you save."}</p>
  </div><div>
    <h2>${st.today ? "✓ Journaled today" : "Streak"} <span class="faint small">· ${st.cur} weekday${st.cur === 1 ? "" : "s"} running · best ${st.best}</span></h2>
    <div class="list" id="jList">${entryList()}</div>
  </div></div>`;

  el.querySelectorAll("#jKind button").forEach(x => x.onclick = () => { S.editing = x.dataset.v === "journal" ? { kind: "journal", date: todayET() } : { kind: "research" }; renderJournal(); });
  $("#jNew") && ($("#jNew").onclick = () => { S.editing = isJ ? { kind: "journal", date: todayET() } : { kind: "research" }; renderJournal(); });
  el.querySelectorAll("[data-entry]").forEach(x => x.onclick = () => viewEntry(x.dataset.entry));
  loadEditor(path, exists, isJ);
}
async function loadEditor(path, exists, isJ){
  const body = $("#jBody"), key = "draft:" + (path || "research-new");
  let text = LS.get(key, null);
  if (text == null){
    if (exists){ try{ text = await GH.raw(path) || ""; }catch(e){ text = ""; toast(explain(e)); } }
    else text = isJ ? JOURNAL_TEMPLATE : RESEARCH_TEMPLATE;
  }
  if (!$("#jBody") || $("#jBody") !== body) return;
  body.value = text; body.disabled = false; body.placeholder = ""; $("#jSave").disabled = false;
  const wc = () => { const n = words(body.value.replace(/^#+ .*$/gm, "")); $("#jWc").textContent = `${n} word${n === 1 ? "" : "s"}`; };
  wc();
  body.addEventListener("input", () => { LS.set(key, body.value); wc(); });
  $("#jSave").onclick = async () => {
    const btn = $("#jSave"), ed = S.editing;
    let p = path;
    if (!isJ && !p){
      const title = $("#jTitle").value.trim(); if (!title){ toast("Give the note a title."); return; }
      const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "note";
      const d = todayET(); p = `research/${d.slice(0, 4)}/${d}-${slug}.md`;
      if (S.shaOf.has(p)) p = p.replace(/\.md$/, `-${rand(3)}.md`);
    }
    let content = body.value.trimEnd() + "\n";
    if (!isJ && !path) content = `# ${$("#jTitle").value.trim()}\n\n` + content;
    if (words(content.replace(/^#+ .*$/gm, "")) < 5){ toast("Write a little more first."); return; }
    btn.disabled = true; btn.textContent = "Saving…";
    try{
      await GH.put(p, content, isJ ? `Journal: ${ed.date}` : `Research: ${$("#jTitle")?.value.trim() || stem(p)}`);
      LS.del(key);
      if (isJ){ if (!S.journal.some(j => j.date === ed.date)) S.journal.unshift({ date: ed.date, path: p }); S.journal.sort((a, b) => a.date < b.date ? 1 : -1); }
      else if (!S.research.some(r => r.path === p)){ S.research.unshift({ path: p, date: todayET(), title: $("#jTitle").value.trim() }); S.editing = { kind: "research", path: p, title: $("#jTitle").value.trim() }; }
      saveCache(); toast("Saved to GitHub ✓"); renderJournal(); renderOverview(); renderRecord();
    }catch(e){ btn.disabled = false; btn.textContent = "Save to GitHub"; toast(explain(e), 4500); }
  };
}
function entryList(){
  const items = [...S.journal.map(j => ({ k: "j", date: j.date, path: j.path, title: fmtDate(j.date, { weekday:"short", month:"short", day:"numeric", year:"numeric" }), sub: "Daily journal" })),
    ...S.research.map(r => ({ k: "r", date: r.date, path: r.path, title: r.title, sub: "Research · " + (r.date ? fmtDate(r.date) : "") }))]
    .sort((a, b) => (a.date + a.k) < (b.date + b.k) ? 1 : -1).slice(0, 60);
  if (!items.length) return `<div class="empty">Nothing yet. Your first entry shows up here.</div>`;
  return items.map(i => `<button class="row" data-entry="${esc(i.path)}"><span class="main"><div class="t" style="text-transform:${i.k === "r" ? "capitalize" : "none"}">${esc(i.title)}</div><div class="s">${esc(i.sub)}</div></span><span class="faint">›</span></button>`).join("");
}
async function viewEntry(path){
  sheet(`<h3>Loading…</h3>`);
  try{
    const t = await GH.raw(path) || "";
    const jm = path.match(/^journal\/.*?(\d{4}-\d{2}-\d{2})\.md$/);
    sheet(`<h3>${jm ? fmtDate(jm[1], { weekday:"long", month:"long", day:"numeric", year:"numeric" }) : "Research note"}</h3>
      <div class="md">${mdToHtml(t)}</div>
      <div class="btn-row" style="margin-top:14px"><button class="btn" id="vEdit">Edit</button><button class="btn" data-close style="flex:1">Close</button></div>`, s => {
      s.querySelector("#vEdit").onclick = () => {
        closeSheet();
        if (jm) S.editing = { kind: "journal", date: jm[1] };
        else { const r = S.research.find(x => x.path === path); S.editing = { kind: "research", path, title: r?.title || stem(path) }; }
        renderJournal(); route("journal");
      };
    });
  }catch(e){ sheet(`<h3>Couldn't open it</h3><p class="down">${esc(explain(e))}</p><button class="btn wide" data-close>Close</button>`); }
}

/* ------------------------------------------------------------------ record */
function renderRecord(){
  const el = $("#view-record");
  if (!S.cfg){ el.innerHTML = connectBanner(); return; }
  const act = activeDays(), st = streaks();
  const today = todayET();
  let mon = today; while (weekday(mon) !== 1) mon = addDays(mon, -1);
  const weeks = 26, start = addDays(mon, -7 * (weeks - 1));
  let cells = "", months = [];
  for (let w = 0; w < weeks; w++){
    const wk = addDays(start, 7 * w);
    if (w % 6 === 0) months.push(fmtDate(wk, { month: "short" }));
    for (let d = 0; d < 5; d++){
      const day = addDays(wk, d), n = act.get(day) || 0;
      cells += `<span class="${n ? "l" + Math.min(3, n) : ""}${day === today ? " today" : ""}" title="${day}${n ? ` · ${n} item${n > 1 ? "s" : ""}` : ""}" style="${day > today ? "opacity:.35" : ""}"></span>`;
    }
  }
  const filled = S.fills.filter(f => f.status === "FILLED");
  const sells = filled.filter(f => f.side === "SELL"), wins = sells.filter(f => f.realized_pnl > 0);
  const closeRuns = (S.runs || []).filter(r => /close/i.test(r.name));
  const lastRun = closeRuns[0];
  el.innerHTML = `<div class="two-col"><div>
    <h2>Activity</h2>
    <div class="card">
      <div class="stats" style="margin-top:0">
        <div class="stat"><div class="k">Days journaled</div><div class="v">${st.total}</div></div>
        <div class="stat"><div class="k">Best streak</div><div class="v">${st.best}</div></div>
        <div class="stat"><div class="k">Orders</div><div class="v">${S.orderPaths.length}</div></div>
        <div class="stat"><div class="k">Research</div><div class="v">${S.research.length}</div></div>
      </div>
      <div class="heat" style="grid-template-columns:repeat(${weeks},1fr)">${cells}</div>
      <div class="heat-months">${months.map(m => `<span>${m}</span>`).join("")}</div>
      <p class="tiny faint" style="margin:8px 0 0">Last 26 weeks, weekdays. Darker means more work that day: journal, orders, research.</p>
    </div>
    <h2>Trades <span class="faint small">${sells.length ? `· ${wins.length} of ${sells.length} closed trades made money` : ""}</span></h2>
    <div class="list">${S.fills.length ? [...S.fills].reverse().slice(0, 80).map(f => `
      <button class="row" data-order="${esc(f.order_id)}">
        <span class="tick" style="color:${f.side === "BUY" ? "var(--green)" : "var(--red)"}">${esc(f.side || "")}</span>
        <span class="main"><div class="t">${esc(f.ticker)} ${f.status === "FILLED" ? `· ${fmt0.format(f.shares)} @ ${money(f.price, true)}` : ""}</div>
          <div class="s">${fmtDate(f.date, { month:"short", day:"numeric", year:"numeric" })} close${f.status !== "FILLED" ? ` · ${esc(f.reason || f.status.toLowerCase())}` : ""}</div></span>
        <span class="r">${f.status === "FILLED" ? (f.realized_pnl != null ? `<span class="${cls(f.realized_pnl)}">${signedMoney(f.realized_pnl)}</span>` : `<span class="faint">${money(f.notional)}</span>`)
          : `<span class="pill ${f.status === "REJECTED" ? "bad" : ""}">${f.status.toLowerCase()}</span>`}</span>
      </button>`).join("") : `<div class="empty">No trades yet.</div>`}</div>
  </div><div>
    <h2>Proof</h2>
    <div class="card small">
      <p style="margin-top:0">Nobody has to take your word for this record:</p>
      <ul class="steps" style="padding-left:18px">
        <li>GitHub's servers timestamp every order and journal entry. Your phone's clock never counts.</li>
        <li>Orders fill at the official close after GitHub receives them, so you can't backdate a trade or pick a price.</li>
        <li>A bot does every fill and mark. Each night's ledger is hashed, chained to the night before and anchored to Bitcoin with OpenTimestamps.</li>
      </ul>
      <dl class="kv"><dt>Daily close job</dt><dd>${lastRun ? `<span class="pill ${lastRun.conclusion === "success" ? "good" : lastRun.conclusion ? "bad" : "warn"}">${esc(lastRun.conclusion || lastRun.status)}</span> ${fmtTime(lastRun.updated_at)}` : S.runs === null ? `<span class="faint">add “Actions: Read” to the token to see this</span>` : "not run yet"}</dd>
      <dt>Trading days recorded</dt><dd>${S.nav.length}</dd>
      <dt>Realized P&L</dt><dd class="${cls(S.state?.realized_pnl || 0)}">${signedMoney(S.state?.realized_pnl || 0)}</dd>
      <dt>Dividends</dt><dd>${money(S.state?.dividends || 0)}</dd>
      <dt>Costs paid</dt><dd>${money(S.state?.costs || 0)}</dd></dl>
      ${S.repo?.html_url ? `<a href="${esc(S.repo.html_url)}" target="_blank" rel="noopener">Open the repo's track-record page ↗</a>` : ""}
    </div>
  </div></div>`;
  el.querySelectorAll("[data-order]").forEach(x => x.onclick = () => orderSheet(x.dataset.order));
}

/* ------------------------------------------------------------------ settings */
function renderSettings(){
  const el = $("#view-settings"), c = S.conn || {};
  const connected = !!c.token;
  const stale = S.engineStale && S.engineStale.length;
  el.innerHTML = `<div class="two-col"><div>
    <h2>${connected ? "Connection" : "Connect your private repo"}</h2>
    ${!connected ? `<div class="card small">
      <ol class="steps" style="margin-top:0">
        <li>On GitHub, create a <b>private</b> repo, e.g. <code class="k">portfolio-track-record</code>. Tick “Add a README file”.</li>
        <li>Create a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained token</a>. Under <b>Repository access</b>, choose “Only select repositories” and pick that repo. Under <b>Permissions</b>, set <b>Contents</b> and <b>Workflows</b> to “Read and write” and <b>Actions</b> to “Read-only”. Give it the longest expiration GitHub offers.</li>
        <li>Paste it below. It's only stored in this browser and only ever sent to GitHub.</li>
      </ol></div>` : ""}
    <div class="card">
      <label class="f" style="margin-top:0">GitHub username</label><input class="in" id="sOwner" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(c.owner || "")}" placeholder="your-username">
      <label class="f">Repo name</label><input class="in" id="sRepo" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(c.repo || "")}" placeholder="portfolio-track-record">
      <label class="f">Token</label><input class="in" id="sToken" type="password" autocomplete="off" value="${esc(c.token || "")}" placeholder="github_pat_…">
      <div class="btn-row" style="margin-top:14px"><button class="btn primary" id="sSave" style="flex:1">${connected ? "Save & reconnect" : "Connect"}</button>${connected ? `<button class="btn danger" id="sOut">Sign out</button>` : ""}</div>
      ${S.error && connected ? `<p class="down small">${esc(explain(S.error))}</p>` : ""}
      ${S.repo && connected && !S.error ? `<p class="small muted" style="margin-bottom:0">${S.repo.private ? "🔒 Private" : "⚠️ <b class='down'>Public</b>. Anyone can see it. Make it private in the repo's settings."} · <a href="${esc(S.repo.html_url)}" target="_blank" rel="noopener">${esc(S.repo.full_name)} ↗</a></p>` : ""}
    </div>
    ${connected && S.setupNeeded && !S.error ? setupCard() : ""}
  </div><div>
    ${connected && !S.setupNeeded && S.cfg ? `<h2>Repo</h2><div class="card small">
      <dl class="kv" style="margin-top:0"><dt>Fund</dt><dd>${esc(S.cfg.fund_name)}</dd><dt>Started</dt><dd>${fmtDate(S.cfg.inception, { month:"short", day:"numeric", year:"numeric" })} with ${money(S.cfg.starting_cash)}</dd>
      <dt>Benchmark</dt><dd>${esc(S.cfg.benchmark)}</dd><dt>Costs</dt><dd>${S.cfg.slippage_bps} bp slippage + ${S.cfg.commission_bps} bp commission</dd>
      <dt>Engine</dt><dd>${S.engineStale == null ? "checking…" : stale ? `<span class="pill warn">update available</span>` : `<span class="pill good">up to date</span>`}</dd></dl>
      ${stale ? `<button class="btn" id="sUpdate">Update engine files</button><p class="tiny faint">Rewrites ${S.engineStale.map(esc).join(", ")} in your repo. Your trades and journal aren't touched.</p>` : ""}
      ${S.runs && S.runs.length ? `<div class="muted" style="margin-top:8px">Recent jobs</div>${S.runs.slice(0, 5).map(r => `<div style="display:flex;justify-content:space-between;gap:8px;margin-top:4px"><span>${esc(r.name)}</span><span><span class="pill ${r.conclusion === "success" ? "good" : r.conclusion ? "bad" : "warn"}">${esc(r.conclusion || r.status)}</span> <span class="faint">${fmtTime(r.created_at)}</span></span></div>`).join("")}` : ""}
      </div>` : ""}
    <h2>On your phone</h2>
    <div class="card small muted">In Safari, tap Share → <b>Add to Home Screen</b> and it opens like an app. Your token is saved per browser, so on a new device you'll paste it once.</div>
    <p class="tiny faint" style="margin-top:14px">Portfolio Desk ${APP_VERSION}</p>
  </div></div>`;
  $("#sSave").onclick = () => {
    const owner = $("#sOwner").value.trim().replace(/^https?:\/\/github\.com\//, "").split("/")[0];
    let repo = $("#sRepo").value.trim(); if (repo.includes("/")) repo = repo.split("/").pop();
    const token = $("#sToken").value.trim();
    if (!owner || !repo || !token){ toast("Fill in all three."); return; }
    S.conn = { owner, repo: repo.replace(/\.git$/, ""), token }; LS.set("conn", S.conn);
    S.cfg = null; S.state = null; S.nav = []; S.fills = []; S.pending = []; S.journal = []; S.research = []; S.orderPaths = []; S.repo = null;
    LS.del("cache"); load();
  };
  $("#sOut") && ($("#sOut").onclick = () => { LS.del("conn"); LS.del("cache"); location.hash = "#settings"; location.reload(); });
  $("#sSetup") && ($("#sSetup").onclick = runSetup);
  $("#sUpdate") && ($("#sUpdate").onclick = updateEngine);
}
function setupCard(){
  return `<h2>Set up the repo</h2><div class="card">
    <p class="small muted" style="margin-top:0">This adds the engine and two daily jobs to <b>${esc(S.conn.repo)}</b>, and starts your $10,000,000 paper portfolio today.</p>
    <label class="f">Portfolio name</label><input class="in" id="suName" value="$10M Paper Portfolio">
    <label class="f">Your name (shown on the track record)</label><input class="in" id="suMgr" value="Jeh Dinshaw">
    <label class="f">Benchmark</label><input class="in" id="suBench" value="SPY" autocapitalize="characters">
    <button class="btn primary wide" id="sSetup">Set up repo</button>
    <ol class="steps progress" id="suProg"></ol>
  </div>`;
}
async function runSetup(){
  const btn = $("#sSetup"); btn.disabled = true; btn.textContent = "Setting up…";
  const prog = $("#suProg"); prog.innerHTML = "";
  const step = (t) => { const li = document.createElement("li"); li.textContent = t; prog.appendChild(li); return li; };
  try{
    if (S.repo && !S.repo.private){
      const li = step("This repo is public. Make it private on GitHub first (Settings → General → Danger Zone → Change visibility), then try again.");
      li.className = "err"; btn.disabled = false; btn.textContent = "Set up repo"; return;
    }
    const cfg = { fund_name: $("#suName").value.trim() || "$10M Paper Portfolio", manager: $("#suMgr").value.trim(),
      starting_cash: START_CASH, inception: todayET(), benchmark: ($("#suBench").value.trim() || "SPY").toUpperCase(),
      slippage_bps: 5, commission_bps: 1 };
    for (const [path, text] of Object.entries(REPO_FILES)){
      const li = step("Adding " + path);
      await GH.put(path, text, "Set up track-record engine: " + path); li.className = "done";
    }
    let li = step("Writing config.json");
    await GH.put("config.json", JSON.stringify(cfg, null, 2) + "\n", "Start the $10M paper portfolio"); li.className = "done";
    li = step("Writing README.md");
    const readme = `# ${cfg.fund_name}\n\n${cfg.manager ? `**${cfg.manager}** · ` : ""}Paper portfolio · started ${fmtDate(cfg.inception, { month:"short", day:"numeric", year:"numeric" })} with $10,000,000 · benchmark ${cfg.benchmark} (total return)\n\nThe first mark happens after the next 4:00 PM ET close. From then on this page rebuilds itself every trading day with performance, positions, trades and the work behind them.\n`;
    await GH.put("README.md", readme, "Track record page"); li.className = "done";
    step("Done. Your portfolio is live.").className = "done";
    toast("Repo is set up ✓"); setTimeout(() => { load(); route("overview"); }, 900);
  }catch(e){
    step(explain(e)).className = "err"; btn.disabled = false; btn.textContent = "Try again";
  }
}
async function updateEngine(){
  const btn = $("#sUpdate"); btn.disabled = true; btn.textContent = "Updating…";
  try{
    for (const path of S.engineStale) await GH.put(path, REPO_FILES[path], `Update ${path} to Portfolio Desk ${APP_VERSION}`);
    toast("Engine updated ✓"); load(true);
  }catch(e){ btn.disabled = false; btn.textContent = "Update engine files"; toast(explain(e), 4500); }
}

/* ------------------------------------------------------------------ boot */
buildTabs();
$("#refreshBtn").onclick = () => load();
window.addEventListener("hashchange", () => route(location.hash.slice(1)));
let _rz; window.addEventListener("resize", () => { clearTimeout(_rz); _rz = setTimeout(() => S.tab === "overview" && drawChart(), 150); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.conn?.token && Date.now() - new Date(S.loadedAt || 0) > 60000) load(true); });
route(location.hash.slice(1) || (S.conn?.token ? "overview" : "settings"));
render();
if (S.conn?.token) load(true);
</script>
</body>
</html>
